<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diegétika — Grupo de Estudos de Artes e Filosofias</title>
    <meta name="description" content="Arte como investigação, corpo como linguagem, cena como reflexão. Conheça o Grupo Diegétika, suas produções, pesquisas e integrantes.">
    <meta name="theme-color" content="#0d0910">
    <link rel="canonical" href="https://neroprdo.github.io/DIEGETIKA/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Diegétika">
    <meta property="og:title" content="Diegétika — Grupo de Estudos de Artes e Filosofias">
    <meta property="og:description" content="Arte como investigação, corpo como linguagem, cena como reflexão. Conheça o Grupo Diegétika, suas produções, pesquisas e integrantes.">
    <meta property="og:url" content="https://neroprdo.github.io/DIEGETIKA/index.html">
    <meta property="og:image" content="https://neroprdo.github.io/DIEGETIKA/assets/images/banners/inicio-01.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="assets/images/brand/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body data-root="" data-page="inicio" data-content-key="inicio">
    <div data-include="partials/header.html"></div>

    <main id="conteudo">
      <section class="hero" aria-label="Apresentação do grupo">
        <div class="carousel hero-carousel" data-autoplay="true">
          <div class="carousel-container">
            <button class="prev" type="button" aria-label="Imagem anterior">❮</button>
            <div class="carousel-slide" data-render="carrossel-inicio"></div>
            <button class="next" type="button" aria-label="Próxima imagem">❯</button>
          </div>
          <div class="carousel-overlay"></div>
        </div>
        <div class="hero-content">
          <img class="hero-logo" data-content-media="pages.inicio.hero.simboloId" alt="Símbolo do Grupo Diegétika">
          <p class="eyebrow" data-content="pages.inicio.hero.eyebrow"></p>
          <h1 data-content="pages.inicio.hero.titulo"></h1>
          <p class="hero-quote" data-content="pages.inicio.hero.frase"></p>
          <p class="hero-lead" data-content="pages.inicio.hero.texto"></p>
          <div class="hero-buttons">
            <a class="btn" href="producoes/" data-content="pages.inicio.acoes.producoes"></a>
            <a class="btn btn-outline" href="contato.html" data-content="pages.inicio.acoes.contato"></a>
          </div>
        </div>
      </section>

      <section class="about-section">
        <div class="container about-content">
          <img class="about-image fade-in" data-content-media="pages.inicio.sobre.imagemId" alt="" loading="lazy" decoding="async">
          <div class="about-text">
            <p class="eyebrow" data-content="pages.inicio.sobre.eyebrow"></p>
            <h2 class="fade-in" data-content="pages.inicio.sobre.titulo"></h2>
            <div data-render="paragrafos" data-source="pages.inicio.sobre.paragrafos"></div>
            <a class="btn btn-purple fade-in" href="historia.html" data-content="pages.inicio.acoes.historia"></a>
          </div>
        </div>
      </section>

      <section class="productions">
        <div class="container">
          <p class="eyebrow text-center" data-content="pages.inicio.secoes.producaoEyebrow"></p>
          <h2 class="section-title fade-in" data-content="pages.inicio.secoes.producaoTitulo"></h2>
          <article class="featured-production fade-in" data-render="producao-destaque"></article>
        </div>
      </section>

      <section class="team">
        <div class="container">
          <p class="eyebrow text-center" data-content="pages.inicio.secoes.integrantesEyebrow"></p>
          <h2 class="section-title fade-in" data-content="pages.inicio.secoes.integrantesTitulo"></h2>
          <div class="team-grid home-team-grid" data-render="integrantes" data-limit="4"></div>
          <div class="text-center mt-3">
            <a class="btn btn-outline" href="integrantes.html" data-content="pages.inicio.acoes.integrantes"></a>
          </div>
        </div>
      </section>

      <section class="gallery">
        <div class="container">
          <p class="eyebrow text-center" data-content="pages.inicio.secoes.galeriaEyebrow"></p>
          <h2 class="section-title fade-in" data-content="pages.inicio.secoes.galeriaTitulo"></h2>
          <div class="gallery-grid home-gallery" data-render="galeria-destaque" data-limit="6"></div>
          <div class="text-center mt-3">
            <a class="btn btn-outline" href="galeria.html" data-content="pages.inicio.acoes.galeria"></a>
          </div>
        </div>
      </section>

      <section class="news">
        <div class="container">
          <p class="eyebrow text-center" data-content="pages.inicio.secoes.noticiasEyebrow"></p>
          <h2 class="section-title fade-in" data-content="pages.inicio.secoes.noticiasTitulo"></h2>
          <div class="news-grid" data-render="noticias" data-limit="3" data-compact="true"></div>
          <div class="text-center mt-3">
            <a class="btn btn-outline" href="noticias.html" data-content="pages.inicio.acoes.noticias"></a>
          </div>
        </div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <button class="mode-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
    <script defer src="content/site.js"></script>
    <script defer src="content/data/midias.js"></script>
    <script defer src="content/data/redes.js"></script>
    <script defer src="content/data/parceiros.js"></script>
    <script defer src="content/data/integrantes.js"></script>
    <script defer src="content/data/noticias.js"></script>
    <script defer src="content/data/galeria.js"></script>
    <script defer src="content/data/atividades.js"></script>
    <script defer src="content/producoes/o-cubo-de-erika.js"></script>
    <script defer src="content/producoes/mostra-de-cenas-curtas.js"></script>
    <script defer src="content/producoes/solos.js"></script>
    <script defer src="content/producoes/sobre-viver.js"></script>
    <script defer src="content/producoes/olho-dagua.js"></script>
    <script defer src="content/producoes/do-choro-ao-riso.js"></script>
    <script defer src="content/pages/inicio.js"></script>
    <script defer src="assets/js/components.js"></script>
    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/site.js"></script>
  </body>
</html>
