<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notícias — Diegétika</title>
    <meta name="description" content="Apresentações, oficinas, leituras, processos e registros publicados pelo Grupo Diegétika.">
    <meta name="theme-color" content="#0d0910">
    <link rel="canonical" href="https://neroprdo.github.io/DIEGETIKA/noticias.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Diegétika">
    <meta property="og:title" content="Notícias — Diegétika">
    <meta property="og:description" content="Apresentações, oficinas, leituras, processos e registros publicados pelo Grupo Diegétika.">
    <meta property="og:url" content="https://neroprdo.github.io/DIEGETIKA/noticias.html">
    <meta property="og:image" content="https://neroprdo.github.io/DIEGETIKA/assets/images/banners/noticias.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="assets/images/brand/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body data-root="" data-page="noticias" data-content-key="noticias">
    <div data-include="partials/header.html"></div>

    <main id="conteudo">
      <section class="page-hero has-image">
        <img
          class="page-hero-image"
          data-content-media="pages.noticias.hero.imagemId"
        alt=""
        >
        <div class="page-hero-overlay"></div>
        <div class="container page-hero-content">
          <p class="eyebrow" data-content="pages.noticias.hero.eyebrow"></p>
          <h1 data-content="pages.noticias.hero.titulo"></h1>
          <p data-content="pages.noticias.hero.texto"></p>
        </div>
      </section>
      <section class="news news-page">
        <div class="container">
          <div class="instagram-callout fade-in">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            <div>
              <strong data-content="pages.noticias.introducao.titulo"></strong>
              <span data-content="pages.noticias.introducao.texto"></span>
            </div>
            <a class="btn btn-small" data-content-href="data.redes.instagram.link" href="#" target="_blank" rel="noopener noreferrer" data-content="pages.noticias.introducao.acao"></a>
          </div>
          <div class="news-toolbar" data-render="filtros-noticias"></div>
          <div class="news-grid" data-render="noticias"></div>
          <p class="empty-filter-message" hidden data-content="pages.noticias.mensagens.semResultados"></p>
          <noscript><p class="content-warning">Ative o JavaScript para visualizar as notícias.</p></noscript>
        </div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <button class="mode-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
    <script defer src="content/site.js"></script>
    <script defer src="content/data/midias.js"></script>
    <script defer src="content/data/redes.js"></script>
    <script defer src="content/data/parceiros.js"></script>
    <script defer src="content/data/noticias.js"></script>
    <script defer src="content/pages/noticias.js"></script>
    <script defer src="assets/js/components.js"></script>
    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/site.js"></script>
  </body>
</html>
