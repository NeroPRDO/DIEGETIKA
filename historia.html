<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>História — Diegétika</title>
    <meta name="description" content="Conheça a trajetória, as pesquisas e as produções do Grupo Diegétika desde 2021.">
    <meta name="theme-color" content="#0d0910">
    <link rel="canonical" href="https://neroprdo.github.io/DIEGETIKA/historia.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Diegétika">
    <meta property="og:title" content="História — Diegétika">
    <meta property="og:description" content="Conheça a trajetória, as pesquisas e as produções do Grupo Diegétika desde 2021.">
    <meta property="og:url" content="https://neroprdo.github.io/DIEGETIKA/historia.html">
    <meta property="og:image" content="https://neroprdo.github.io/DIEGETIKA/assets/images/banners/historia.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="assets/images/brand/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body data-root="" data-page="historia" data-content-key="historia">
    <div data-include="partials/header.html"></div>

    <main id="conteudo">
      <section class="page-hero has-image">
        <img
          class="page-hero-image"
          data-content-media="pages.historia.hero.imagemId"
        alt=""
        >
        <div class="page-hero-overlay"></div>
        <div class="container page-hero-content">
          <p class="eyebrow" data-content="pages.historia.hero.eyebrow"></p>
          <h1 data-content="pages.historia.hero.titulo"></h1>
          <p data-content="pages.historia.hero.texto"></p>
        </div>
      </section>
      <section class="content-section">
        <div class="container about-content">
          <div class="about-text content-copy">
            <p class="eyebrow" data-content="pages.historia.introducao.eyebrow"></p>
            <h2 data-content="pages.historia.introducao.titulo"></h2>
            <div data-render="paragrafos" data-source="pages.historia.introducao.paragrafos"></div>
          </div>
          <img class="about-image fade-in" data-content-media="pages.historia.introducao.imagemId" alt="" loading="lazy" decoding="async">
        </div>
      </section>
      <section class="content-section content-section-alt">
        <div class="container">
          <p class="eyebrow text-center" data-content="pages.historia.jornada.eyebrow"></p>
          <h2 class="section-title" data-content="pages.historia.jornada.titulo"></h2>
          <div class="content-copy" data-render="paragrafos" data-source="pages.historia.jornada.paragrafos"></div>
        </div>
      </section>
      <section class="content-section">
        <div class="container">
          <h2 class="section-title" data-content="pages.historia.timelineTitulo"></h2>
          <div class="timeline" data-render="timeline"></div>
        </div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <button class="mode-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
    <script defer src="content/site.js"></script>
    <script defer src="content/data/midias.js"></script>
    <script defer src="content/data/redes.js"></script>
    <script defer src="content/data/parceiros.js"></script>
    <script defer src="content/pages/historia.js"></script>
    <script defer src="assets/js/components.js"></script>
    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/site.js"></script>
  </body>
</html>
