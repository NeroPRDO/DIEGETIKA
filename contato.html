<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contato — Diegétika</title>
    <meta name="description" content="Canais oficiais para convites, parcerias, apresentações e informações sobre o Grupo Diegétika.">
    <meta name="theme-color" content="#0d0910">
    <link rel="canonical" href="https://neroprdo.github.io/DIEGETIKA/contato.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Diegétika">
    <meta property="og:title" content="Contato — Diegétika">
    <meta property="og:description" content="Canais oficiais para convites, parcerias, apresentações e informações sobre o Grupo Diegétika.">
    <meta property="og:url" content="https://neroprdo.github.io/DIEGETIKA/contato.html">
    <meta property="og:image" content="https://neroprdo.github.io/DIEGETIKA/assets/images/banners/contato.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="assets/images/brand/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body data-root="" data-page="contato" data-content-key="contato">
    <div data-include="partials/header.html"></div>

    <main id="conteudo">
      <section class="page-hero has-image">
        <img
          class="page-hero-image"
          data-content-media="pages.contato.hero.imagemId"
        alt=""
        >
        <div class="page-hero-overlay"></div>
        <div class="container page-hero-content">
          <p class="eyebrow" data-content="pages.contato.hero.eyebrow"></p>
          <h1 data-content="pages.contato.hero.titulo"></h1>
          <p data-content="pages.contato.hero.texto"></p>
        </div>
      </section>
      <section class="contact">
        <div class="container contact-content">
          <div class="contact-info">
            <h2 data-content="pages.contato.introducao.titulo"></h2>
            <p data-content="pages.contato.introducao.texto"></p>
            <div class="contact-details" data-render="canais-contato"></div>
          </div>
          <div class="contact-map fade-in">
            <iframe data-content-src="pages.contato.mapa" title="Mapa da Casa do Contador de Histórias" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </section>
      <section class="partners-section content-section-alt">
        <div class="container text-center">
          <p class="eyebrow" data-content="pages.contato.parceiros.eyebrow"></p>
          <h2 class="section-title" data-content="pages.contato.parceiros.titulo"></h2>
          <p data-content="pages.contato.parceiros.textoBreve"></p>
          <p class="partner-description" data-content="pages.contato.parceiros.textoCompleto"></p>
          <div class="partners-grid" data-render="parceiros" data-source="data.parceiros"></div>
        </div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
    <button class="mode-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
    <script defer src="content/site.js"></script>
    <script defer src="content/data/midias.js"></script>
    <script defer src="content/data/redes.js"></script>
    <script defer src="content/data/parceiros.js"></script>
    <script defer src="content/pages/contato.js"></script>
    <script defer src="assets/js/components.js"></script>
    <script defer src="assets/js/content.js"></script>
    <script defer src="assets/js/site.js"></script>
  </body>
</html>
